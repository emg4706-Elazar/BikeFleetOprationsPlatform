services:
  kafka:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"


  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bike-fleet
      NYSQL_USER: bike-app
      MYSQL_PASSWORD: bike-password
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
      
    